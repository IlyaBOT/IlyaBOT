name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Check stats token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Add a read-only STATS_TOKEN repository secret to generate account-wide cards."
            exit 1
          fi

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&title_color=A371F7&icon_color=A371F7&ring_color=A371F7
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&langs_count=6&layout=compact&theme=github_dark&title_color=A371F7
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats&theme=github_dark&title_color=A371F7&icon_color=A371F7
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
